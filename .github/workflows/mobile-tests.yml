name: Mobile BDD Tests (Android + Appium)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-tests.yml'
  workflow_dispatch:

jobs:
  android-mobile:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify Appium and UiAutomator2 driver
        run: |
          npx appium --version
          npx appium driver list --installed
          if ! npx appium driver list --installed 2>&1 | grep -q uiautomator2; then
            echo "UiAutomator2 driver not detected; installing it explicitly"
            npx appium driver install --source=npm appium-uiautomator2-driver
          fi

      - name: Download Sauce Labs sample app (2.7.1)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/saucelabs.apk" \
            "https://github.com/saucelabs/sample-app-mobile/releases/download/2.7.1/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk"
          ls -lh "$RUNNER_TEMP/saucelabs.apk"

      - name: Enable KVM (required for the x86_64 emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Boots a hardware-accelerated emulator, then runs this one-line script.
      # The action executes each `script` line with `sh -c`, so all logic lives
      # in the versioned helper below (bash, pipefail, boot + adb verification).
      - name: Run mobile tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: ci_mobile_api34
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-boot-anim -noaudio -gpu swiftshader_indirect
          script: bash mobile/ci/run-mobile-tests.sh "$RUNNER_TEMP/saucelabs.apk"

      - name: Generate mobile Allure HTML report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx --yes allure-commandline generate allure-results-mobile --clean -o reports/allure-report-mobile

      - name: Verify Allure HTML report output
        if: ${{ !cancelled() }}
        run: |
          if [ -f reports/allure-report-mobile/index.html ]; then
            echo "Allure HTML report generated at reports/allure-report-mobile/index.html"
          else
            echo "::warning::Mobile Allure HTML report was not generated"
          fi

      - name: Upload reports on success
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports
          path: |
            reports/
            allure-results-mobile/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload mobile diagnostics (on failure)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-diagnostics
          path: |
            reports/
            allure-results-mobile/
          if-no-files-found: ignore
          retention-days: 30
