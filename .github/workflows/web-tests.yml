name: Web BDD Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium
    - name: Run Cucumber web tests
      run: npm run test:web:report
    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: npx --yes allure-commandline generate allure-results --clean -o reports/allure-report
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: web-test-reports
        path: |
          reports/
          allure-results/
        retention-days: 30
